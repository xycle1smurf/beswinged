# Gleiches Schema wie schema.example.yaml, als Properties-Datei.
# Die Reihenfolge der Spalten bestimmt "columns" (kommagetrennte IDs).

title=Meine App-Logs
columns=time,level,logger,thread,msg,user,duration,exc

column.time.name=Zeit
column.time.path=@timestamp
column.time.width=190

column.level.name=Level
column.level.path=level
column.level.width=70
column.level.type=loglevel

column.logger.name=Logger
column.logger.path=logger
column.logger.width=220

column.thread.name=Thread
column.thread.path=thread
column.thread.width=120

column.msg.name=Nachricht
column.msg.path=message
column.msg.width=600

column.user.name=User
column.user.path=context.user.id
column.user.width=90

column.duration.name=Dauer ms
column.duration.path=context.durationMs
column.duration.width=80

column.exc.name=Exception
column.exc.path=error.type
column.exc.width=200

rowColors.path=level
rowColors.values.ERROR=#FFD6D6
rowColors.values.WARN=#FFF2C2
rowColors.values.DEBUG=#EEEEEE
